[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cscs-al-partial"
version = "0.1.0"
description = "Dataset-aware curriculum active learning with targeted partial annotation for 3D medical image segmentation (CSCS-AL)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Remi Hattat", email = "remi.hattat@univ-lorraine.fr" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ssl = ["torch>=2.0"]
viz = ["matplotlib>=3.7"]
nnunet = ["nnunetv2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["cscs_al_partial*"]
